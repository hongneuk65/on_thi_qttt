      options: [

        "Regression",

        "Goal Seek",

        "Solver",

        "Cả B và C"

      ],

      correctAnswerIndex: 1

    }

  ]

}
        };

        const sectionSelect = document.getElementById('section-select');
        const quizContainer = document.getElementById('quiz-container');

        // 1. Khởi tạo danh sách các phần vào dropdown
        function init() {
            for (const key in quizData) {
                const option = document.createElement('option');
                option.value = key;
                option.textContent = quizData[key].title;
                sectionSelect.appendChild(option);
            }
        }

        // 2. Lắng nghe sự kiện khi người dùng chọn phần ôn tập
        sectionSelect.addEventListener('change', (e) => {
            const selectedKey = e.target.value;
            quizContainer.innerHTML = ''; // Xóa nội dung cũ

            if (selectedKey && quizData[selectedKey]) {
                renderQuestions(quizData[selectedKey].questions);
            }
        });

        // 3. Hiển thị danh sách câu hỏi của phần được chọn
        function renderQuestions(questions) {
            questions.forEach((q, qIndex) => {
                const questionCard = document.createElement('div');
                questionCard.className = 'question-card';

                const questionTitle = document.createElement('div');
                questionTitle.className = 'question-title';
                questionTitle.textContent = `Câu ${qIndex + 1}: ${q.question}`;
                questionCard.appendChild(questionTitle);

                const optionsContainer = document.createElement('div');
                optionsContainer.className = 'options';

                q.options.forEach((optText, optIndex) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn';
                    btn.textContent = optText;
                    
                    // Xử lý sự kiện khi click chọn đáp án
                    btn.onclick = () => handleAnswer(btn, optIndex, q.correctAnswerIndex, optionsContainer);
                    
                    optionsContainer.appendChild(btn);
                });

                questionCard.appendChild(optionsContainer);
                quizContainer.appendChild(questionCard);
            });
        }

        // 4. Xử lý logic đúng/sai khi click đáp án
        function handleAnswer(clickedBtn, selectedIndex, correctIndex, optionsContainer) {
            const allButtons = optionsContainer.querySelectorAll('.option-btn');
            
            // Vô hiệu hóa tất cả các nút để không cho chọn lại
            allButtons.forEach((btn, index) => {
                btn.disabled = true;
                
                // Hiển thị màu xanh cho đáp án đúng
                if (index === correctIndex) {
                    btn.classList.add('correct');
                }
            });

            // Nếu người dùng chọn sai, hiển thị màu đỏ cho nút vừa click
            if (selectedIndex !== correctIndex) {
                clickedBtn.classList.add('incorrect');
            }
        }

        // Khởi động trang
        init();
    </script>
</body>
</html>
