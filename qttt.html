    <style>
        :root {
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --bg-body: #f8f9fa;
            --bg-card: #ffffff;
            --text-main: #333;
            --success: #27ae60;
            --error: #e74c3c;
        }

        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: var(--bg-body); color: var(--text-main); }

        /* Sidebar Navigation */
        .sidebar { width: 280px; background: var(--primary-color); color: white; overflow-y: auto; padding: 20px 0; flex-shrink: 0; }
        .sidebar h2 { padding: 0 20px; font-size: 1.2rem; margin-bottom: 20px; color: var(--accent-color); }
        .nav-group { margin-bottom: 15px; }
        .nav-header { padding: 10px 20px; background: rgba(255,255,255,0.1); font-weight: bold; font-size: 0.9rem; text-transform: uppercase; letter-spacing: 1px; }
        .nav-item { padding: 10px 30px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; display: block; color: #bdc3c7; text-decoration: none; }
        .nav-item:hover { background: rgba(255,255,255,0.05); color: white; }
        .nav-item.active { background: var(--accent-color); color: white; border-left: 4px solid white; }

        /* Main Content Area */
        .main-content { flex-grow: 1; overflow-y: auto; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: var(--bg-card); padding: 30px; border-radius: 12px; box-shadow: 0 5px 15px rgba(0,0,0,0.05); }
        
        .quiz-header { border-bottom: 2px solid #eee; margin-bottom: 30px; padding-bottom: 10px; }
        .quiz-header h1 { margin: 0; font-size: 1.5rem; color: var(--primary-color); }

        /* Question Styles */
        .question-block { margin-bottom: 30px; padding: 20px; border: 1px solid #edf2f7; border-radius: 8px; }
        .question-text { font-weight: 600; margin-bottom: 15px; display: block; line-height: 1.4; }
        
        .option { display: block; padding: 12px 15px; margin: 8px 0; border: 1px solid #e2e8f0; border-radius: 6px; cursor: pointer; transition: all 0.2s; position: relative; }
        .option:hover { background: #f7fafc; border-color: var(--accent-color); }
        .option input { margin-right: 10px; }

        /* Result Styles */
        .option.correct { background: #d4edda !important; border-color: #c3e6cb !important; color: #155724; }
        .option.incorrect { background: #f8d7da !important; border-color: #f5c6cb !important; color: #721c24; }

        .sticky-footer { position: sticky; bottom: -40px; background: white; padding: 20px 0; border-top: 1px solid #eee; margin-top: 40px; }
        .btn-submit { background: var(--accent-color); color: white; border: none; padding: 15px 30px; border-radius: 6px; cursor: pointer; font-size: 1rem; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-submit:hover { background: #2980b9; transform: translateY(-2px); }
        
        #result-display { margin-top: 20px; text-align: center; font-size: 1.2rem; font-weight: bold; color: var(--accent-color); }

        /* Responsive */
        @media (max-width: 768px) {
            body { flex-direction: column; }
            .sidebar { width: 100%; height: 200px; }
            .main-content { padding: 20px; }
        }
    </style>
</head>

    let currentQuestions = [];

    // Tự động tạo Menu Sidebar
    function initMenu() {
        const nav = document.getElementById('nav-container');
        for (const [chap, parts] of Object.entries(quizData)) {
            let group = document.createElement('div');
            group.className = 'nav-group';
            group.innerHTML = `<div class="nav-header">${chap}</div>`;
            
            for (const partName of Object.keys(parts)) {
                let item = document.createElement('a');
                item.className = 'nav-item';
                item.innerText = partName;
                item.href = "#";
                item.onclick = (e) => {
                    e.preventDefault();
                    renderQuiz(chap, partName);
                    // Active class logic
                    document.querySelectorAll('.nav-item').forEach(el => el.classList.remove('active'));
                    item.classList.add('active');
                };
                group.appendChild(item);
            }
            nav.appendChild(group);
        }
    }

    function renderQuiz(chap, part) {
        const container = document.getElementById('quiz-container');
        const title = document.getElementById('current-title');
        const actionArea = document.getElementById('action-area');
        
        currentQuestions = quizData[chap][part];
        title.innerText = `${chap} - ${part}`;
        document.getElementById('result-display').innerText = "";
        actionArea.style.display = currentQuestions.length > 0 ? 'block' : 'none';
        
        if (currentQuestions.length === 0) {
            container.innerHTML = "<p style='color: #666;'>Chưa có dữ liệu câu hỏi cho phần này. Vui lòng thêm vào mã nguồn.</p>";
            return;
        }

        container.innerHTML = currentQuestions.map((q, idx) => `
            <div class="question-block" data-correct="${q.dap_an}">
                <span class="question-text">Câu ${q.cau}: ${q.cau_hoi}</span>
                <label class="option"><input type="radio" name="q${idx}" value="A"> A. ${q.A}</label>
                <label class="option"><input type="radio" name="q${idx}" value="B"> B. ${q.B}</label>
                <label class="option"><input type="radio" name="q${idx}" value="C"> C. ${q.C}</label>
                <label class="option"><input type="radio" name="q${idx}" value="D"> D. ${q.D}</label>
            </div>
        `).join('');
    }

    function checkAnswers() {
        const blocks = document.querySelectorAll('.question-block');
        let score = 0;

        blocks.forEach((block, idx) => {
            const correctAns = block.dataset.correct;
            const selected = block.querySelector(`input[name="q${idx}"]:checked`);
            const options = block.querySelectorAll('.option');

            options.forEach(opt => opt.classList.remove('correct', 'incorrect'));

            if (selected) {
                if (selected.value === correctAns) {
                    score++;
                    selected.parentElement.classList.add('correct');
                } else {
                    selected.parentElement.classList.add('incorrect');
                    highlightCorrect(options, correctAns);
                }
            } else {
                highlightCorrect(options, correctAns);
            }
        });

        document.getElementById('result-display').innerText = `KẾT QUẢ: ${score} / ${blocks.length}`;
    }

    function highlightCorrect(options, correctAns) {
        options.forEach(opt => {
            if (opt.querySelector('input').value === correctAns) {
                opt.classList.add('correct');
            }
        });
    }

    // Khởi chạy
    initMenu();
</script>
